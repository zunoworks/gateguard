name: 'GateGuard Check'
description: 'Verify GateGuard fact-forcing gate is configured for Claude Code'
branding:
  icon: 'shield'
  color: 'blue'
inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.12'
  trail-dir:
    description: >-
      Directory containing an exported gate_log.jsonl audit trail. When
      set, the action verifies the hash chain and any committed anchors
      (refs/gateguard/anchors/) and fails on tampering.
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - shell: bash
      run: pip install gateguard-ai
    - shell: bash
      run: |
        if [ ! -f .gateguard.yml ]; then
          echo "::warning::No .gateguard.yml found. Run 'gateguard init' to set up GateGuard."
          exit 0
        fi
        echo "GateGuard configuration found."
        gateguard --version
    - shell: bash
      env:
        TRAIL_DIR: ${{ inputs.trail-dir }}
      run: |
        if [ -z "$TRAIL_DIR" ]; then
          exit 0
        fi
        if [ ! -f "$TRAIL_DIR/gate_log.jsonl" ]; then
          echo "::error::trail-dir set but $TRAIL_DIR/gate_log.jsonl not found."
          exit 1
        fi
        GATEGUARD_STATE_DIR="$TRAIL_DIR" gateguard audit --verify
